spring.application.name=taphoa123
# Database URL - Replace 'localhost:5432' and 'your_db_name'
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres

# Credentials
spring.datasource.username=postgres
spring.datasource.password=123456

# Driver Class (Optional in newer Spring Boot versions, but good for clarity)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
# 'update' will create tables if they don't exist and update them as you change your Java code
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL queries in your console (Very helpful for debugging)
spring.jpa.show-sql=true

# Formats the SQL in the console to be readable
spring.jpa.properties.hibernate.format_sql=true

# Ensures Hibernate uses the correct PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Set server port to avoid 8080 conflict
server.port=8081